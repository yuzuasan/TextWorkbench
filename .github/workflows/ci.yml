name: Build and Test

on:
  push:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore TextWorkbench.slnx

      - name: Build
        run: dotnet build TextWorkbench.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test TextWorkbench.slnx --configuration Release --no-build --no-restore
